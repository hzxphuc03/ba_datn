<!-- Angular Login Component Template -->
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/images/logo.png" alt="Logo" class="logo">
      <h2 class="login-title">Đăng Nhập</h2>
      <p class="login-subtitle">Chào mừng bạn quay trở lại</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- User Type Selection -->
      <div class="form-group">
        <label class="form-label">Loại tài khoản</label>
        <div class="user-type-selector">
          <label class="radio-option">
            <input 
              type="radio" 
              formControlName="userType" 
              value="khach-hang"
              class="radio-input">
            <span class="radio-label">
              <i class="fas fa-user"></i>
              Khách hàng
            </span>
          </label>
          <label class="radio-option">
            <input 
              type="radio" 
              formControlName="userType" 
              value="nhan-vien"
              class="radio-input">
            <span class="radio-label">
              <i class="fas fa-user-tie"></i>
              Nhân viên
            </span>
          </label>
        </div>
      </div>

      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="form-label">
          Tài khoản <span class="required">*</span>
        </label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input
            id="username"
            type="text"
            formControlName="username"
            class="form-input"
            [class.error]="hasError('username')"
            placeholder="Nhập tài khoản của bạn"
            autocomplete="username">
        </div>
        <div *ngIf="hasError('username')" class="error-message">
          {{ getErrorMessage('username') }}
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          Mật khẩu <span class="required">*</span>
        </label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="form-input"
            [class.error]="hasError('password')"
            placeholder="Nhập mật khẩu của bạn"
            autocomplete="current-password">
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="hasError('password')" class="error-message">
          {{ getErrorMessage('password') }}
        </div>
      </div>

      <!-- Remember Me -->
      <div class="form-group">
        <label class="checkbox-wrapper">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="checkbox-input">
          <span class="checkbox-label">Ghi nhớ đăng nhập</span>
        </label>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i>
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="login-button"
        [disabled]="loginForm.invalid || loading"
        [class.loading]="loading">
        <span *ngIf="!loading">
          <i class="fas fa-sign-in-alt"></i>
          Đăng nhập
        </span>
        <span *ngIf="loading" class="loading-content">
          <i class="fas fa-spinner fa-spin"></i>
          Đang đăng nhập...
        </span>
      </button>

      <!-- Additional Links -->
      <div class="form-links">
        <a (click)="goToForgotPassword()" class="link">
          Quên mật khẩu?
        </a>
        <span class="separator">|</span>
        <a (click)="goToRegister()" class="link">
          Đăng ký tài khoản
        </a>
      </div>
    </form>

    <!-- Social Login (Optional) -->
    <div class="social-login">
      <div class="divider">
        <span>Hoặc đăng nhập với</span>
      </div>
      <div class="social-buttons">
        <button class="social-button google">
          <i class="fab fa-google"></i>
          Google
        </button>
        <button class="social-button facebook">
          <i class="fab fa-facebook-f"></i>
          Facebook
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div *ngIf="loading" class="loading-overlay">
  <div class="loading-spinner">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Đang xử lý...</p>
  </div>
</div>
