services:
  # Spring Boot Web Service
  - type: web
    name: datn-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free  # hoặc starter, standard, pro
    region: singapore  # hoặc oregon, frankfurt, etc.
    branch: testing  # branch để deploy
    healthCheckPath: /actuator/health
    envVars:
      # Database Configuration (Render PostgreSQL)
      - key: SPRING_DATASOURCE_URL
        sync: false  # Set manually in Render dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      
      # JWT Configuration (QUAN TRỌNG - phải set)
      - key: JWT_SECRET
        sync: false  # Set manually - must be at least 32 characters
      
      # CORS Configuration (QUAN TRỌNG - set domain frontend)
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set manually: https://yourdomain.com,https://www.yourdomain.com
      
      # Email Configuration (optional)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      
      # Spring Profile
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      
      # Hibernate Dialect
      - key: HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      
      # Port (Render tự động inject, nhưng có thể set default)
      - key: PORT
        value: 8080
      
      # Socket.IO Configuration (DISABLED for production - Render only exposes 1 port)
      # Socket.IO sẽ không hoạt động trên Render vì chỉ có 1 port (8080)
      # Nếu cần real-time, dùng STOMP WebSocket trên cùng port HTTP
      - key: SOCKETIO_ENABLED
        value: "false"

      # Cloudinary Configuration (for image upload)
      # Get these from https://cloudinary.com/console
      - key: CLOUDINARY_CLOUD_NAME
        sync: false  # Set manually in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false  # Set manually in Render dashboard

