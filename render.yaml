services:
  - type: web
    name: ba-datn-backend
    runtime: docker
    plan: free
    # Với Docker, không cần buildCommand và startCommand
    # Render sẽ tự động build và chạy từ Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      # Lưu ý: Các environment variables nhạy cảm nên set trong Render Dashboard
      # thay vì commit vào file này. Thêm các biến sau trong tab "Environment":
      # - SPRING_DATASOURCE_URL
      # - SPRING_DATASOURCE_USERNAME
      # - SPRING_DATASOURCE_PASSWORD
      # - JWT_SECRET
      # - JWT_EXPIRATION
      # - JWT_REFRESH_EXPIRATION
      # - MAIL_HOST
      # - MAIL_PORT
      # - MAIL_USERNAME
      # - MAIL_PASSWORD
      # - CORS_ALLOWED_ORIGINS

