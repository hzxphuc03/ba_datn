spring.application.name=mycode
spring.mvc.view.prefix: /WEB-INF/view/
spring.mvc.view.suffix: .jsp

# Database Configuration - Use environment variables for production
# For local development, uncomment SQL Server config or use PostgreSQL
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DATN_SD40;encrypt=true;trustServerCertificate=true;
#spring.datasource.username=sa
#spring.datasource.password=123456
#spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# PostgreSQL Configuration (use env vars for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datn_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Email Configuration - Use environment variables for production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger Configuration
app.swagger.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# JWT Configuration - Use environment variables for production
# WARNING: Change JWT_SECRET in production!
app.jwt.secret=${JWT_SECRET:myVerySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity2024}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration (có thể override bằng environment variable)
# Format: http://localhost:4200,https://yourdomain.com
# Dùng "*" để allow all origins (chỉ dùng cho development)
app.cors.allowed-origins=*

# Tắt Swagger trong production
spring.profiles.active=dev

# Socket.IO Configuration (for local development)
socketio.enabled=true
socketio.host=0.0.0.0
socketio.port=9092

# Cloudinary Configuration (for image upload)
# Get these from https://cloudinary.com/console
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
