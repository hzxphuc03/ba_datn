# Production Configuration
spring.profiles.active=prod

# Database Configuration
# Sử dụng environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Ví dụ PostgreSQL: jdbc:postgresql://host:port/dbname
# Ví dụ SQL Server: jdbc:sqlserver://host:port;databaseName=DB_NAME;encrypt=true;trustServerCertificate=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datn_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA/Hibernate Configuration
# Lưu ý: ddl-auto=update cho phép Hibernate tự tạo/cập nhật schema
# Sau khi deploy thành công và có dữ liệu, nên đổi lại validate để bảo mật hơn
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# QUAN TRỌNG: Phải set dialect PostgreSQL để Hibernate dùng đúng types (VARCHAR thay vì NVARCHAR)
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false
# Đảm bảo Hibernate không dùng SQL Server types
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
# PORT được inject tự động bởi hosting platform (Railway/Render/Fly.io)
server.port=${PORT:8080}

# JWT Configuration
# Sử dụng environment variables: JWT_SECRET, JWT_EXPIRATION, JWT_REFRESH_EXPIRATION
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Email Configuration
# Sử dụng environment variables: MAIL_USERNAME, MAIL_PASSWORD
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
# Sử dụng environment variable: CORS_ALLOWED_ORIGINS
# Format: https://domain1.com,https://domain2.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Tắt Swagger trong production
app.swagger.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Tắt debug logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.datn.be.mycode=INFO

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Management endpoints (health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# HikariCP Connection Pool Configuration (Production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Socket.IO Configuration (DISABLED for production - Render only exposes 1 port)
# Socket.IO sẽ không hoạt động trên Render vì chỉ có 1 port (8080)
# Nếu cần Socket.IO, phải dùng STOMP WebSocket trên cùng port HTTP hoặc disable Socket.IO
socketio.enabled=${SOCKETIO_ENABLED:false}
socketio.host=0.0.0.0
socketio.port=9092

# Cloudinary Configuration (for image upload)
# Set these in Render dashboard environment variables
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.domain=${SPRING_DOMAIN:http://localhost:4200}