<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header text-center bg-primary text-white">
                    <h4>Đăng Ký Tài Khoản</h4>
                </div>

                <div class="card-body">
                    <!-- bind với @ModelAttribute("user") -->
                    <form th:action="@{/dang-ky/success}"
                          th:object="${user}"
                          method="post">

                        <!-- email -->
                        <input type="hidden" th:field="*{email}" th:value="${email}"/>

                        <!-- Tên người dùng -->
                        <div class="mb-3">
                            <label>Tên người dùng</label>
                            <input class="form-control" th:field="*{tenNguoiDung}">
                            <div class="text-danger" th:text="${erro4}"></div>
                        </div>

                        <!-- SĐT -->
                        <div class="mb-3">
                            <label>SĐT</label>
                            <input class="form-control" th:field="*{SDT}">
                            <div class="text-danger" th:text="${erro3}"></div>
                        </div>

                        <!-- Tài khoản -->
                        <div class="mb-3">
                            <label>Tài khoản</label>
                            <input class="form-control" th:field="*{taiKhoan}">
                            <div class="text-danger" th:text="${erro1}"></div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label>Mật khẩu</label>
                            <input type="password" class="form-control" th:field="*{matKhau}">
                        </div>

                        <!-- Nhập lại mật khẩu -->
                        <div class="mb-3">
                            <label>Nhập lại mật khẩu</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}">
                            <div class="text-danger" th:text="${erro2}"></div>
                        </div>

                        <button class="btn btn-primary w-100">Đăng ký</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
